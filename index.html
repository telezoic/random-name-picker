<!DOCTYPE html>
<html class="no-js" lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width" />
  <title>Random Name Picker</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/foundation/6.7.5/css/foundation.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/modernizr/2.8.3/modernizr.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
  <style>
    #values {
      position:relative;
      font-size:400%;
      text-align:center;
      margin: 0 auto;
      z-index:0;
    }
    .name {
      overflow:hidden;
      display:block;
      color: #ffffff;
    }
    #result1 {
      /*background:#81D6E3;*/
      color: #fff;
      -webkit-text-stroke: 20px #000;
      paint-order: stroke fill;
      font-size: 175px;
      padding:20px;
      opacity: 0.9;

      font-weight: bold;
      z-index:10;
      margin-top:-150px;
      margin-bottom:20px;
      border-radius: 10px !important;
    }
    body {
      background-image: url('img/lg1.png');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center center;
      background-attachment: fixed;
      position: relative;
      min-height: 100vh;
    }
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.04);
      z-index: -1;
    }
    div.large-12.columns {
      font-size:25px;
      text-align:center;
      padding:30px;
    }
    #varnote {
      font-size:25px;
      text-align:center;
      padding:30px;
      margin-top: 1075px;
      color: #000;
    }
    .copyright {
      font-size:25px;
      font-family:Tahoma;
      color:#000;
      margin-bottom: 25px;
      text-align:left;
    }
    h3 {
      color: #abc517;
    }
    .loading {
      display: none;
      text-align: center;
      color: #1ce805;
      font-size: 40px;
      font-weight: bold;
      margin: 20px 0;
    }
    .status-message {
      padding: 10px;
      margin: 10px 0;
      border-radius: 10px;
      text-align: center;
    }
    .success {
     /* background-color: #dff0d8;*/
      font-size: 61px;
      font-weight: bold;
      color: #f5d906
    }
    .error {
      background-color: #f2dede;
      color: #a94442;
    }
    .name-counter {
      font-size: 61px;
      color: #f5d906;
      padding: 10px 15px;
     /* background: rgba(255,255,255,0.9); */
      border-radius: 10px;
    }
    .top-bar-section {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .button-group.even-3 {
      margin: 0;
      border-radius: 10px;
      overflow: hidden;
      list-style: none; /* Add this line */
    }

    .button-group.even-3 li {
      border-radius: 0;
      list-style: none; /* Add this line */
    }
    .button-group.even-3 li:first-child button {
      border-top-left-radius: 10px;
      border-bottom-left-radius: 10px;
    }
    .button-group.even-3 li:last-child a,
    .button-group.even-3 li:last-child button {
      border-top-right-radius: 10px;
      border-bottom-right-radius: 10px;
    }
    .button {
      border-radius: 0;
    }
    #go {
      background: transparent !important;
      border: 0;
      color: #1ce805;
      font-size: 60px;
      font-weight: bold;
      box-shadow: none;
      transition: color 0.2s ease, opacity 0.2s ease, transform 0.2s ease;
    }
    #go:hover,
    #go:focus,
    #go:active {
      background: transparent !important;
      opacity: 0.75;
      transform: scale(1.05);
    }
    .alert.button {
      border-radius: 10px !important;
    }
    .remove-name-btn svg {
      display: block;
      width: 24px;
      height: 24px;
    }
    #result1 .extra {
      margin-top: -75px;
    }
    .resetter {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 30;
      font-size: 40px;
      font-weight: bold;
      color: #f5d906;
      padding: 10px 15px;
      background: transparent;
      border: 0;
      box-shadow: none;
      border-radius: 10px;
      cursor: pointer;
      transition: color 0.2s ease, opacity 0.2s ease, transform 0.2s ease;
    }
    .resetter:hover,
    .resetter:focus,
    .resetter:active {
      background: transparent;
      opacity: 0.75;
      transform: scale(1.05);
    }




    @media (max-width: 768px) {
      .top-bar-section {
        flex-direction: column;
        gap: 15px;
      }
      .name-counter {
        order: -1;
      }
      #values {
        font-size: 300%;
      }
      .button-group.even-3 {
        border-radius: 10px;
        overflow: visible;
      }
      .button-group.even-3 li {
        margin-bottom: 5px;
        border-radius: 10px !important;
      }
      .button-group.even-3 li:last-child {
        margin-bottom: 0;
      }
    }
    @media (max-width: 480px) {
      #values {
        font-size: 200%;
      }
    }
  </style>
</head>
<body>
  <div class="row">
    <div class="large-12 columns" style="padding-top:50px;z-index:20;">
      <div class="top-bar-section">
        <ul class="button-group even-3">
          <li><button class="success button" id="go" onclick="go();">SPIN!</button></li>
          <!-- <li><a href="https://github.com/telezoic/random-name-picker/blob/gh-pages/names.js" class="button" id="editSource" target="_blank">VIEW NAMES</a></li> -->
        </ul>
        <div class="name-counter">
          <strong id="availableCount">0</strong> |  <strong id="removedCount">0</strong>
        </div>
      </div>
    </div>
  </div>
  
  <button class="resetter" id="resetAll" onclick="resetAllNames();">RESET</button>

  <div class="row">
    <div class="large-12 columns">
      <h3 style="text-align:center;margin-top:5px;" id="headline"></h3>
      
      <div class="loading" id="loading"></div>
      <div id="status-message"></div>

      
      <div id="values"></div>
    </div>
  </div>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/foundation/6.7.5/js/foundation.min.js"></script>
  <script>
    $(document).foundation();
    
    let text = '';
    let names = [];
    let totalNames = 0;

    // Initialize the app
    $(document).ready(function() {
      loadNames();
    });

    // Load the current names from the server
    async function loadNames() {
      showLoading(true);
      clearStatus();
      
      try {
        const state = await requestJson('/api/names');
        updateNameState(state);
      } catch (error) {
        showStatus(error.message, 'error');
      } finally {
        showLoading(false);
      }
    }

    // Update the counts display
    function updateCounts() {
      $('#availableCount').text(names.length);
      $('#removedCount').text(Math.max(totalNames - names.length, 0));
    }

    function updateNameState(state) {
      names = state.names;
      totalNames = state.total;
      updateCounts();
    }

    async function requestJson(path, options = {}) {
      const response = await fetch(path, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          ...options.headers,
        },
      });
      const result = await response.json();
      if (!response.ok) {
        throw new Error(result.error || 'The request could not be completed.');
      }
      return result;
    }

    // Reset names from the backup object in MinIO
    async function resetAllNames() {
      $('#resetAll').prop('disabled', true);
      try {
        updateNameState(await requestJson('/api/reset', { method: 'POST' }));
        showStatus('ALL NAMES RESTORED', 'success');
      } catch (error) {
        showStatus(error.message, 'error');
      } finally {
        $('#resetAll').prop('disabled', false);
      }
    }

    function go() {
      if (names.length === 0) {
        showStatus('No names available!', 'error');
        return;
      }
      
      $("#varnote").hide();
      $('body').css({"overflow-y": "hidden"});
      $('#go').attr('disabled', 'disabled');
      $('#headline').slideUp();
      
      let count = 1;
      $("div").remove("#result1");
      
      $("#values").show();
      $(".name").show();
      $("div").remove(".name");
      $("div").remove(".extra");
      
      const shuffledNames = [...names];
      for (let i = shuffledNames.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffledNames[i], shuffledNames[j]] = [shuffledNames[j], shuffledNames[i]];
      }

      const newtop = shuffledNames.length * 200 * -1;
      $('#values').css({top: + newtop});

      // Create name elements
      for (const name of shuffledNames) {
        $('#values').append($('<div>', {
          id: `result${count}`,
          class: 'name',
          text: name,
        }));
        count = count + 1;
      }
      
      // Add two more sets for smooth animation
      for(let i = 0; i < 2; i++) {
        for (const name of shuffledNames) {
          $('#values').append($('<div>', { class: 'name', text: name }));
        }
      }
      
      text = $('#result1').text();
      $('#values').animate({top: '+176'}, 5000);
      
      setTimeout(function() {
        standout(text);
      }, 5000);
    }
    
    // Highlight
    function standout(text) {
      $('#result1').removeClass('name');
      $('.name').animate({opacity: .25});
      $('#result1').animate({height: '+=55px'});
      
      // Use event delegation for the remove button
      $('#result1').append('<div class="extra"><a class="small alert button remove-name-btn" href="#" aria-label="Remove selected name" title="Remove selected name"><svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6m5 4v6m4-6v6"/></svg></a></div>');
      
      $('#go').removeAttr('disabled');
      $('#headline').text('');
      $('#headline').slideDown();
    }
    
    // Remove name (persistent)
    async function removevictim() {
      $('.remove-name-btn').prop('disabled', true);
      try {
        updateNameState(await requestJson('/api/remove', {
          method: 'POST',
          body: JSON.stringify({ name: text }),
        }));
        $('#result1').text('Removed');
        $('#result1').delay(2000).fadeOut(1000, function() {
          $('#values').empty();
        });
      } catch (error) {
        showStatus(error.message, 'error');
        $('.remove-name-btn').prop('disabled', false);
      }
    }

    // Use event delegation for dynamically created remove buttons
    $(document).on('click', '.remove-name-btn', function(e) {
      e.preventDefault();
      removevictim();
    });

    // Utility functions
    function showLoading(show) {
      $('#loading').toggle(show);
    }
    
    function showStatus(message, type) {
      $('#status-message').empty().append(
        $('<div>', { class: `status-message ${type}`, text: message })
      );
      if (type === 'success') {
        setTimeout(clearStatus, 3000);
      }
    }
    
    function clearStatus() {
      $('#status-message').html('');
    }
  </script>
</body>
</html>
